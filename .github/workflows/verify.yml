name: Verify RareCognos
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Transaction and mint state tests
        run: |
          npm run test:transaction
          node --experimental-strip-types --test src/lib/nft/availability.test.ts src/lib/nft/mint-phase.test.ts
