name: Blockchain contract tests (local EVM)

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/nft-compile.mjs"
      - "scripts/compile-release.mjs"
      - "qa/midnight-rogues.mjs"
      - "config/midnight-rogues*.json"
      - "public/contracts/MidnightRogues*.json"
      - "scripts/nft-local.mjs"
      - "scripts/nft-test.mjs"
      - "scripts/drop-test.mjs"
      - "src/lib/nft/**"
      - "upload-service/**"
      - ".github/workflows/blockchain-contracts.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/nft-compile.mjs"
      - "scripts/compile-release.mjs"
      - "qa/midnight-rogues.mjs"
      - "config/midnight-rogues*.json"
      - "public/contracts/MidnightRogues*.json"
      - "scripts/nft-local.mjs"
      - "scripts/nft-test.mjs"
      - "scripts/drop-test.mjs"
      - "src/lib/nft/**"
      - "upload-service/**"
      - ".github/workflows/blockchain-contracts.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  nft-and-drop-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Build native SQLite dependency for upload integration scenario
        run: npm rebuild better-sqlite3 --no-audit --no-fund
      - name: Compile Solidity contracts
        run: npm run nft:compile
      - name: Test NFT marketplace mint-list-buy and failure scenarios (Ganache)
        run: node --experimental-strip-types scripts/nft-test.mjs
      - name: Test creator drop factory, public mint and fee rules (Ganache)
        run: node scripts/drop-test.mjs
      - name: Verify MIDNIGHT ROGUES expansion and the combined edition cap
        run: |
          node scripts/compile-release.mjs MidnightRoguesExpansion
          git diff --exit-code -- config/midnight-rogues-expansion.json public/contracts/MidnightRoguesExpansion.json
          node qa/midnight-rogues.mjs
