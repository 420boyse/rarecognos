<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RareCognos — Fan Stack (4 works)</title>
<style>
  body { margin: 0; background: #050505; color: #f5f4ef; font-family: system-ui, sans-serif; }
  .fan-section {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(59,91,255,0.08) 0%, transparent 60%), #050505;
    overflow-x: clip;
    padding: 40px 16px 80px;
  }
  .fan-header { text-align: center; margin-bottom: 24px; max-width: 420px; }
  .fan-header h2 { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 8px; }
  .fan-header p { font-size: 14px; color: rgba(245,244,239,0.55); margin: 0; }
  .fan-container {
    position: relative; width: 100%; max-width: 1100px; height: 400px;
    touch-action: pan-y; cursor: grab; user-select: none;
  }
  .fan-container:active { cursor: grabbing; }
  .fan-slot, .fan-card {
    position: absolute; left: 50%; top: 50%;
    border-radius: 20px; overflow: hidden; will-change: transform;
  }
  .fan-slot { z-index: 1; pointer-events: none; }
  .fan-slot img, .fan-card img { width: 100%; height: 100%; object-fit: cover; }
  .fan-slot-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.42); }
  .fan-card-image { position: absolute; inset: 0; }
  .fan-card-overlay { position: absolute; inset: 0; background: #000; }
  .fan-card-ghost { position: absolute; inset: 0; border: 1px solid rgba(245,244,239,0.35); border-radius: inherit; opacity: 0; }
  .fan-card-border { position: absolute; inset: 0; border: 2.5px solid #3b5bff; border-radius: inherit; opacity: 0; }
  .fan-detail { margin-top: 36px; text-align: center; }
  .fan-meta { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(245,244,239,0.45); margin-bottom: 8px; }
  .fan-title { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 16px; }
  .fan-actions { display: flex; gap: 12px; justify-content: center; }
  .btn { min-height: 44px; padding: 0 22px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .primary { background: #f5f4ef; color: #050505; border: none; }
  .secondary { background: transparent; color: #f5f4ef; border: 1px solid rgba(245,244,239,0.2); display: none; }
</style>
</head>
<body>
<div class="fan-section">
  <div class="fan-header">
    <h2>Featured Studio Works</h2>
    <p>Drag to browse. Studio previews — not sale listings.</p>
  </div>
  <div class="fan-container" id="fan"></div>
  <div class="fan-detail">
    <div class="fan-meta" id="meta">Blackened chrome · 2026 · RareCognos</div>
    <h3 class="fan-title" id="title">Nocturne</h3>
    <div class="fan-actions">
      <button class="btn primary" id="viewBtn">View Details</button>
      <button class="btn secondary" id="collectBtn">Collect</button>
    </div>
  </div>
</div>
<script>
const cards = [
  { id: "nocturne", title: "Nocturne", image: "../public/art/nocturne.jpg", medium: "Blackened chrome", year: "2026", collectible: false },
  { id: "blue-index", title: "Blue Index", image: "../public/art/blue-index.jpg", medium: "Chromatic study", year: "2026", collectible: false },
  { id: "red-aperture", title: "Red Aperture", image: "../public/art/red-aperture.jpg", medium: "Pigment and metal", year: "2026", collectible: false },
  { id: "second-sight", title: "Second Sight", image: "../public/art/second-sight.jpg", medium: "Blackened chrome", year: "2026", collectible: false },
];
const N = cards.length;
const FAN_ROTATION = 4.5, FAN_SPREAD = 0.38, SCALE_STEP = 0.2, EDGE_SLOT = 2, GHOST_RANGE = 1.2;
const FRICTION = 0.91, SNAP_SPRING = 0.09, SNAP_DAMPING = 0.72, DRAG_SENSITIVITY = 0.0035;
const AXIS_LOCK_THRESHOLD = 10;

let scrollPos = 0, velocity = 0, isDragging = false;
let lastX = 0, lastTime = 0, lastMoveTime = 0, startX = 0, startY = 0;
let axisLocked = null;
let cardSize = window.innerWidth < 640 ? 200 : 260;

const container = document.getElementById("fan");
const cardEls = [];
const slotLeft = document.createElement("div");
const slotRight = document.createElement("div");
slotLeft.className = slotRight.className = "fan-slot";
slotLeft.innerHTML = slotRight.innerHTML = '<img alt=""><div class="fan-slot-overlay"></div>';
container.appendChild(slotLeft);
container.appendChild(slotRight);
const leftImg = slotLeft.querySelector("img");
const rightImg = slotRight.querySelector("img");

cards.forEach((c) => {
  const el = document.createElement("div");
  el.className = "fan-card";
  el.innerHTML = '<div data-image class="fan-card-image"><img src="' + c.image + '" alt="' + c.title + '" draggable="false"><div data-overlay class="fan-card-overlay"></div></div><div data-ghost class="fan-card-ghost"></div><div data-border class="fan-card-border"></div>';
  container.appendChild(el);
  cardEls.push(el);
});

function wrapIndex(i, n) { return ((i % n) + n) % n; }

function update() {
  const height = cardSize * 1.25;
  const spread = cardSize * FAN_SPREAD;
  cards.forEach((_, i) => {
    const el = cardEls[i];
    let offset = i - scrollPos;
    while (offset > N / 2) offset -= N;
    while (offset < -N / 2) offset += N;
    const abs = Math.abs(offset);
    const isGhost = abs >= EDGE_SLOT;
    const ghostOpacity = isGhost ? Math.max(0, 1 - (abs - EDGE_SLOT) / GHOST_RANGE) : 1;
    el.style.width = cardSize + "px";
    el.style.height = height + "px";
    el.style.marginLeft = -cardSize / 2 + "px";
    el.style.marginTop = -height / 2 + "px";
    el.style.transform = "translate3d(" + (offset * spread) + "px,0,0) rotate(" + (offset * FAN_ROTATION) + "deg) scale(" + Math.max(0.45, 1 - abs * SCALE_STEP) + ")";
    el.style.opacity = ghostOpacity;
    el.style.zIndex = isGhost ? 0 : Math.round((EDGE_SLOT + 1 - abs) * 10);
    el.querySelector("[data-image]").style.opacity = isGhost ? 0 : 1;
    el.querySelector("[data-ghost]").style.opacity = isGhost ? 1 : 0;
    el.querySelector("[data-border]").style.opacity = isGhost ? 0 : Math.max(0, 1 - abs * 2.2);
    el.querySelector("[data-overlay]").style.opacity = isGhost ? 0 : Math.min(0.4, (abs / EDGE_SLOT) * 0.4);
  });
  const edgeScale = Math.max(0.5, 1 - EDGE_SLOT * SCALE_STEP);
  const edgeW = cardSize * edgeScale, edgeH = height * edgeScale;
  const edgeRot = FAN_ROTATION * EDGE_SLOT, edgeTx = EDGE_SLOT * spread;
  [slotLeft, slotRight].forEach((el, idx) => {
    const sign = idx === 0 ? -1 : 1;
    el.style.width = edgeW + "px";
    el.style.height = edgeH + "px";
    el.style.borderRadius = (20 * edgeScale) + "px";
    el.style.marginLeft = -edgeW / 2 + "px";
    el.style.marginTop = -edgeH / 2 + "px";
    el.style.transform = "translate3d(" + (sign * edgeTx) + "px,0,0) rotate(" + (sign * edgeRot) + "deg)";
  });
  leftImg.src = cards[wrapIndex(Math.floor(scrollPos) - EDGE_SLOT, N)].image;
  rightImg.src = cards[wrapIndex(Math.ceil(scrollPos) + EDGE_SLOT, N)].image;
  const cIdx = wrapIndex(Math.round(scrollPos), N);
  document.getElementById("title").textContent = cards[cIdx].title;
  document.getElementById("meta").textContent = cards[cIdx].medium + " · " + cards[cIdx].year + " · RareCognos";
  document.getElementById("collectBtn").style.display = cards[cIdx].collectible ? "inline-flex" : "none";
}

function loop() {
  if (!isDragging) {
    scrollPos += velocity;
    velocity *= FRICTION;
    if (Math.abs(velocity) < 0.12) {
      const nearest = Math.round(scrollPos);
      velocity += (nearest - scrollPos) * SNAP_SPRING;
      velocity *= SNAP_DAMPING;
    }
    if (Math.abs(velocity) < 0.0008) {
      velocity = 0;
      scrollPos = Math.round(scrollPos);
    }
  }
  update();
  requestAnimationFrame(loop);
}
loop();

container.addEventListener("pointerdown", (e) => {
  isDragging = true;
  axisLocked = null;
  velocity = 0;
  startX = lastX = e.clientX;
  startY = e.clientY;
  lastTime = lastMoveTime = performance.now();
  container.setPointerCapture(e.pointerId);
});

container.addEventListener("pointermove", (e) => {
  if (!isDragging) return;
  const adx = Math.abs(e.clientX - startX);
  const ady = Math.abs(e.clientY - startY);
  if (!axisLocked && (adx > AXIS_LOCK_THRESHOLD || ady > AXIS_LOCK_THRESHOLD)) {
    axisLocked = adx > ady * 1.25 ? "h" : "v";
  }
  if (axisLocked === "v") return;
  if (axisLocked !== "h") return;
  e.preventDefault();
  const dx = e.clientX - lastX;
  const now = performance.now();
  const dt = Math.max(8, now - lastTime);
  scrollPos -= dx * DRAG_SENSITIVITY;
  velocity = (-dx * DRAG_SENSITIVITY / dt) * 16 * 1.15;
  lastX = e.clientX;
  lastTime = lastMoveTime = now;
});

function endDrag() {
  if (performance.now() - lastMoveTime > 120) velocity = 0;
  isDragging = false;
  axisLocked = null;
}
container.addEventListener("pointerup", endDrag);
container.addEventListener("pointercancel", endDrag);

document.getElementById("viewBtn").addEventListener("click", () => {
  const cIdx = wrapIndex(Math.round(scrollPos), N);
  alert("View Details: " + cards[cIdx].title);
});

window.addEventListener("resize", () => {
  cardSize = window.innerWidth < 640 ? 200 : 260;
});
</script>
</body>
</html>
